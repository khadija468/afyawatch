# Nginx site for AfyaWatch on a small Ubuntu VM with PHP 8.2-FPM.
# Replace afyawatch.example.org with your domain, then get a certificate with:
#   sudo certbot --nginx -d afyawatch.example.org

# Plain HTTP only redirects to HTTPS (Let's Encrypt renewals still work through certbot).
server {
    listen 80;
    listen [::]:80;
    server_name afyawatch.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name afyawatch.example.org;
    root /var/www/afyawatch/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/afyawatch.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afyawatch.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (browsers refuse plain HTTP for this domain for a year) is sent by the application
    # on every page; Nginx adds it only to the static files it serves itself, so it is never doubled.

    server_tokens off;
    client_max_body_size 2m;
    charset utf-8;

    # Compression matters on slow mobile connections.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/csv application/javascript application/json application/fhir+json application/xml image/svg+xml;

    # Built assets have a content hash in their names, so they can be cached for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.svg {
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles such as .env or .git.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
